document.getElementById('w').innerHTML=h;
// ?export: يحفظ كل ورقة PNG (400×580) باسمها مثل S-14.png عشان تنحط في app/assets/cards
if(location.search.includes('export'))(async()=>{let k=0;const ids=[];for(const s of ['H','C','D','S']){for(let r=1;r<=10;r++)ids.push(`${s}-${r===1?14:r}`);ids.push(`${s}-11`,`${s}-12`,`${s}-13`);}
for(const svg of document.querySelectorAll('#w svg')){const src=svg.outerHTML.replace('width="100%"','width="400" height="580"').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'}));});
const cv=document.createElement('canvas');cv.width=400;cv.height=580;cv.getContext('2d').drawImage(img,0,0,400,580);
const png=await new Promise((r)=>cv.toBlob(r,'image/png'));await fetch('/save?name='+ids[k++]+'.png',{method:'POST',body:png});}
document.title='exported '+k;})();
