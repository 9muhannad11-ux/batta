<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف الجوكر الكبير</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 12px; }
  #stage { position: relative; width: 360px; height: 560px; background: #0d0d0d; border-radius: 22px; overflow: hidden; border: 3px solid #333; }
  #table { position: absolute; left: 30px; right: 30px; top: 90px; height: 300px; border-radius: 150px; background: radial-gradient(#1e1e1e, #121212); border: 1px solid #2c2c2c; }
  .seat { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #2a2a2a; border: 3px solid; }
  .seat span { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: #ccc; }
  #hand { z-index: 10; position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; opacity: 0; }
  #ring { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid #f5c518; opacity: 0; pointer-events: none; }
  .shake { animation: shake .28s; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-5px,3px); } 40% { transform: translate(5px,-3px); } 60% { transform: translate(-3px,2px); } 80% { transform: translate(2px,-1px); } }
  .row { margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font-size: 15px; padding: 8px 14px; border-radius: 10px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
  #info { font-size: 13px; color: #888; margin-top: 8px; direction: ltr; }
  canvas { margin-top: 8px; background: #111; border-radius: 8px; }
</style>
</head>
<body>
<div id="stage">
  <div id="table"></div>
  <div id="ring"></div>
  <svg id="hand" viewBox="-55 -55 110 110">
    <defs>
      <radialGradient id="skin" cx="0" cy="0.15" r="0.75">
        <stop offset="0" stop-color="#f0c39d"/><stop offset=".65" stop-color="#e2ab83"/><stop offset="1" stop-color="#c98e66"/>
      </radialGradient>
      <linearGradient id="fing" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d79f78"/><stop offset=".45" stop-color="#efc29c"/><stop offset="1" stop-color="#d1976f"/>
      </linearGradient>
    </defs>
    <!-- ظل اليد على الطاولة -->
    <ellipse cx="4" cy="6" rx="40" ry="44" fill="#000" opacity=".28"/>
    <g stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <!-- الإبهام -->
      <path d="M-24,6 Q-38,0 -45,-12 Q-49,-20 -43,-23 Q-37,-25 -32,-17 Q-26,-8 -21,-4 Z" fill="url(#fing)"/>
      <!-- الأصابع (البنصر والخنصر أقصر) -->
      <path d="M-25,-3 L-25,-36 Q-25,-43 -19.5,-43 Q-14,-43 -14,-36 L-14,-3 Z" fill="url(#fing)"/>
      <path d="M-12.5,-3 L-12.5,-44 Q-12.5,-51 -6.5,-51 Q-0.5,-51 -0.5,-44 L-0.5,-3 Z" fill="url(#fing)"/>
      <path d="M1,-3 L1,-42 Q1,-49 7,-49 Q13,-49 13,-42 L13,-3 Z" fill="url(#fing)"/>
      <path d="M14.5,-2 L14.5,-31 Q14.5,-37 19.5,-37 Q24.5,-37 24.5,-31 L24.5,-2 Z" fill="url(#fing)"/>
      <!-- الراحة -->
      <path d="M-26,-8 Q-28,18 -16,32 Q2,42 22,32 Q30,20 27,-6 Q12,-12 -2,-11 Q-16,-11 -26,-8 Z" fill="url(#skin)"/>
    </g>
    <!-- الأظافر -->
    <g fill="#f7ddd0" stroke="#111" stroke-width="1">
      <path d="M-22.5,-40 Q-19.5,-44 -16.5,-40 L-16.5,-35 Q-19.5,-33.5 -22.5,-35 Z"/>
      <path d="M-9.5,-48 Q-6.5,-52 -3.5,-48 L-3.5,-43 Q-6.5,-41.5 -9.5,-43 Z"/>
      <path d="M4,-46 Q7,-50 10,-46 L10,-41 Q7,-39.5 4,-41 Z"/>
      <path d="M17,-34 Q19.5,-37.5 22,-34 L22,-30 Q19.5,-28.5 17,-30 Z"/>
      <path d="M-44,-20 Q-41,-24 -37.5,-21 L-36,-17 Q-39,-15 -42,-16.5 Z"/>
    </g>
    <!-- مفاصل الأصابع وخطوط الكف -->
    <g stroke="#111" stroke-width="1" fill="none" opacity=".8">
      <path d="M-23,-26 q3.5,1.5 7,0 M-23,-16 q3.5,1.5 7,0"/>
      <path d="M-10.5,-33 q4,1.5 8,0 M-10.5,-20 q4,1.5 8,0"/>
      <path d="M3,-31 q4,1.5 8,0 M3,-18 q4,1.5 8,0"/>
      <path d="M16.5,-23 q3,1.3 6,0 M16.5,-13 q3,1.3 6,0"/>
      <path d="M-39,-13 q3,2 6,0"/>
    </g>
    <g stroke="#9b6544" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M-20,2 Q-4,8 18,0"/>
      <path d="M-22,10 Q-6,14 8,22 Q14,26 16,30"/>
      <path d="M-14,-2 Q-18,12 -12,26"/>
    </g>
  </svg>
</div>
<div class="row">
  <button data-seat="0">أنا أضرب</button>
  <button data-seat="3">مصبّح (مقابلي)</button>
  <button data-seat="1">خصيب (يمين)</button>
  <button data-seat="5">مرهون (يسار)</button>
</div>
<div class="row">
  <button data-full="0">أنا: إشارة + ورقة</button>
  <button data-full="3">مصبّح: إشارة + ورقة</button>
  <button data-full="5">مرهون: إشارة + ورقة</button>
</div>
<div id="info">loading…</div>
<canvas id="wave" width="340" height="60"></canvas>
<script>
// أماكن اللاعبين (6 لاعبين، أنا تحت)
const SEATS = [[180, 430, '#3d8bff', 'أنا'], [52, 300, '#f5c518', 'خصيب'], [52, 170, '#3d8bff', 'صديق'], [180, 60, '#f5c518', 'مصبّح'], [308, 170, '#3d8bff', 'سلوم'], [308, 300, '#f5c518', 'مرهون']];
const stage = document.getElementById('stage');
for (const [x, y, c, n] of SEATS) {
  const d = document.createElement('div'); d.className = 'seat'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.borderColor = c;
  d.innerHTML = `<span>${n}</span>`; stage.appendChild(d);
}
const hand = document.getElementById('hand'), ring = document.getElementById('ring'), info = document.getElementById('info');
let ctx, buf, hitAt = 0, trimmed;
const FALL_MS = 170; // وقت نزول اليد لين تلمس الطاولة

async function load() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const data = await (await fetch('signal_big_hit.mp3')).arrayBuffer();
  buf = await ctx.decodeAudioData(data);
  // نحسب القوة كل 5ms ونلقى البداية ولحظة الضربة (أعلى قمة) والنهاية
  const ch = buf.getChannelData(0), rate = buf.sampleRate, win = Math.round(rate * 0.005);
  const env = [];
  for (let i = 0; i < ch.length; i += win) { let m = 0; for (let j = i; j < Math.min(ch.length, i + win); j++) m = Math.max(m, Math.abs(ch[j])); env.push(m); }
  const peak = Math.max(...env), peakIdx = env.indexOf(peak);
  const thr = peak * 0.02;
  let start = env.findIndex((v) => v > thr), end = env.length - 1;
  while (end > start && env[end] < peak * 0.004) end--;
  start = Math.max(0, start - 1); end = Math.min(env.length - 1, end + 6);
  hitAt = (peakIdx - start) * 0.005;
  // نسخة مقصوصة: من البداية للنهاية، قناة وحدة، آخرها يتلاشى
  // الإشارة تظهر ثانية ونص، فنقص الصوت عند 1.8 ثانية ونخلي آخره يتلاشى
  const MAX_S = 1.8;
  const a = start * win, b = Math.min(ch.length, end * win, a + Math.round(rate * MAX_S)), n = b - a, fade = Math.round(rate * 0.35);
  const mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[a + i] / buf.numberOfChannels; }
  for (let i = 0; i < fade; i++) mono[n - 1 - i] *= i / fade;
  const GAIN = 0.7; // صوت الإشارة أخف شوي
  for (let i = 0; i < n; i++) mono[i] *= GAIN;
  trimmed = ctx.createBuffer(1, n, rate); trimmed.copyToChannel(mono, 0);
  info.textContent = `original ${buf.duration.toFixed(2)}s → trimmed ${(n / rate).toFixed(2)}s, hit at ${(hitAt * 1000).toFixed(0)}ms`;
  drawWave(env.slice(start, end + 1), peakIdx - start);
  saveWav(mono, rate);
}

function drawWave(env, peakI) {
  const cv = document.getElementById('wave'), g = cv.getContext('2d'), m = Math.max(...env);
  g.fillStyle = '#7aa7ff';
  env.forEach((v, i) => { const x = i / env.length * cv.width, h = v / m * 56; g.fillRect(x, 30 - h / 2, Math.max(1, cv.width / env.length), h); });
  g.fillStyle = '#f5c518'; g.fillRect(peakI / env.length * cv.width, 0, 2, 60);
}

function saveWav(mono, rate) {
  const out = new DataView(new ArrayBuffer(44 + mono.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + mono.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, rate, true);
  out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, mono.length * 2, true);
  mono.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
  fetch('/save?name=signal_big_ready.wav', { method: 'POST', body: out.buffer }).catch(() => {});
}

function slap(seat, spot) {
  if (!trimmed) return;
  ctx.resume();
  const [sx, sy] = SEATS[seat];
  // اليد تنزل من مكان اللاعب لنقطة على الطاولة قدامه (أو على الورقة اللي رماها)
  const [tx, ty] = spot || [sx + (180 - sx) * 0.5, sy + (240 - sy) * 0.5];
  const fromX = sx + (sx - 180) * 0.25, fromY = sy + (sy - 240) * 0.25;
  const rot = Math.atan2(240 - sy, 180 - sx) * 180 / Math.PI + 90;
  // الصوت يبدأ بحيث قمة الضربة توافق لحظة لمس اليد للطاولة
  const lead = FALL_MS / 1000 - hitAt;
  const src = ctx.createBufferSource(); src.buffer = trimmed; src.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.03 + Math.max(0, -lead);
  src.start(t0 + Math.max(0, lead));
  const startAnim = () => {
    hand.getAnimations().forEach((x) => x.cancel());
    hand.style.left = tx + 'px'; hand.style.top = ty + 'px';
    hand.animate([
      { transform: `translate(${fromX - tx}px,${fromY - ty}px) rotate(${rot}deg) scale(1.6)`, opacity: 0 },
      { transform: `translate(${(fromX - tx) * .4}px,${(fromY - ty) * .4}px) rotate(${rot}deg) scale(1.35)`, opacity: 1, offset: .6 },
      { transform: `translate(0,0) rotate(${rot}deg) scale(1)`, opacity: 1 },
    ], { duration: FALL_MS, easing: 'cubic-bezier(.5,0,1,1)', fill: 'forwards' });
    setTimeout(() => {
      // لحظة الضربة: الطاولة تهتز، ودائرة ذهبية تنتشر، واليد تبقى شوي وتختفي
      stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
      ring.style.left = tx + 'px'; ring.style.top = ty + 'px';
      ring.animate([{ transform: 'scale(1)', opacity: .9 }, { transform: 'scale(7)', opacity: 0 }], { duration: 450, easing: 'ease-out' });
      hand.animate([{ transform: `rotate(${rot}deg) scale(1)`, opacity: 1 }, { transform: `rotate(${rot}deg) scale(1.03)`, opacity: 1, offset: .7 }, { transform: `rotate(${rot}deg) scale(1.1)`, opacity: 0 }],
        { duration: 650, fill: 'forwards' });
    }, FALL_MS);
  };
  setTimeout(startAnim, (t0 - ctx.currentTime) * 1000);
}
// إشارة الجوكر فوق راس اللاعب (J ذهبي)، وبعدها اللاعب نفسه يرمي ورقة قدامه مع صوت الرمي
let flick;
async function loadFlick() {
  const data = await (await fetch('play_ready.wav')).arrayBuffer();
  flick = await ctx.decodeAudioData(data);
}
function bubble(seat) {
  const [sx, sy] = SEATS[seat];
  const b = document.createElement('div');
  b.style.cssText = `position:absolute;left:${sx}px;top:${sy - 44}px;transform:translate(-50%,-50%);padding:2px 10px;border-radius:12px;background:#1d1d1d;border:2px solid ${SEATS[seat][2]};font:900 18px Georgia,serif;color:#f5c518`;
  b.textContent = 'J';
  stage.appendChild(b);
  setTimeout(() => b.remove(), 1500);
}
function cardSpot(seat) { const [sx, sy] = SEATS[seat]; return [180 + (sx - 180) * 0.32, 240 + (sy - 240) * 0.32]; }
function throwCard(seat) {
  const [sx, sy] = SEATS[seat];
  const [tx, ty] = cardSpot(seat); // مكان الورقة قدام صاحبها
  const c = document.createElement('div');
  c.style.cssText = `position:absolute;left:${tx}px;top:${ty}px;width:40px;height:58px;margin:-29px 0 0 -20px;background:#fff;border:1px solid #999;border-radius:5px;font:bold 15px 'Times New Roman',serif;color:#111;padding:2px 4px;box-sizing:border-box`;
  c.innerHTML = 'K<br>&#9824;';
  stage.appendChild(c);
  const rot = (seat % 2 ? -1 : 1) * 8;
  // توصل الورقة لمكانها بنفس لحظة ضربة الكف
  c.animate([{ transform: `translate(${sx - tx}px,${sy - ty}px) scale(1.3) rotate(${rot * 3}deg)` }, { transform: `translate(0,0) scale(1) rotate(${rot}deg)` }],
    { duration: FALL_MS + 30, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  setTimeout(() => c.remove(), 2600);
}
async function full(seat) {
  // إشارة الجوكر الكبير ما تطلع فوق الشخصية: الكف يكفي
  setTimeout(() => { throwCard(seat); slap(seat, cardSpot(seat)); }, 1000); // يرمي ورقته والكف يضربها على الطاولة
}
document.querySelectorAll('button[data-seat]').forEach((b) => b.onclick = () => slap(+b.dataset.seat));
document.querySelectorAll('button[data-full]').forEach((b) => b.onclick = () => full(+b.dataset.full));
load().catch((e) => info.textContent = 'error: ' + e);
</script>
</body>
</html>
