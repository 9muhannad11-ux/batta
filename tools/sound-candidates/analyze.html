<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sound analyze</title></head>
<body style="background:#111;color:#ccc;font:13px monospace">
<!-- يحلل صوت (?f=file.mp3): المدة، وأماكن الضربات، ويحفظ مقطع منه (?save=name.wav&from=s&to=s&gain=x) -->
<pre id="out">loading…</pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const ctx = new AudioContext();
  const buf = await ctx.decodeAudioData(await (await fetch(q.get('f'))).arrayBuffer());
  const ch = buf.getChannelData(0), rate = buf.sampleRate, win = Math.round(rate * 0.01);
  const env = [];
  for (let i = 0; i < ch.length; i += win) { let m = 0; for (let j = i; j < Math.min(ch.length, i + win); j++) m = Math.max(m, Math.abs(ch[j])); env.push(m); }
  const peak = Math.max(...env);
  // ضربات: قمم محلية فوق 35% من أعلى قمة، وبينها 80ms على الأقل
  const hits = [];
  for (let i = 1; i < env.length - 1; i++) if (env[i] > peak * 0.35 && env[i] >= env[i - 1] && env[i] >= env[i + 1] && (!hits.length || i - hits[hits.length - 1] > 8)) hits.push(i);
  const gaps = hits.slice(1).map((h, k) => ((h - hits[k]) * 10));
  let txt = `duration ${buf.duration.toFixed(2)}s, rate ${rate}, channels ${buf.numberOfChannels}, peak ${peak.toFixed(2)}\n`;
  txt += `hits (${hits.length}): ${hits.slice(0, 40).map((h) => (h / 100).toFixed(2)).join(' ')}\n`;
  txt += `gaps ms: ${gaps.slice(0, 40).join(' ')}\n`;
  txt += 'envelope (100ms): ' + Array.from({ length: Math.ceil(env.length / 10) }, (_, k) => Math.round(Math.max(...env.slice(k * 10, k * 10 + 10)) / peak * 9)).join('') + '\n';
  if (q.get('save')) {
    const from = +q.get('from') || 0, to = +q.get('to') || buf.duration, gain = +q.get('gain') || 1;
    const a = Math.round(from * rate), b = Math.min(ch.length, Math.round(to * rate)), n = b - a, fade = Math.round(rate * 0.02);
    const mono = new Float32Array(n);
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[a + i] / buf.numberOfChannels * gain; }
    for (let i = 0; i < fade; i++) mono[n - 1 - i] *= i / fade;
    const out = new DataView(new ArrayBuffer(44 + n * 2));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, rate, true);
    out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 2, true);
    mono.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
    txt += await (await fetch('/save?name=' + q.get('save'), { method: 'POST', body: out.buffer })).text();
  }
  document.getElementById('out').textContent = txt;
})().catch((e) => document.getElementById('out').textContent = 'error ' + e);
</script>
</body>
</html>
