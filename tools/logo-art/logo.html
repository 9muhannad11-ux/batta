<!doctype html>
<html lang="ar">
<head><meta charset="utf-8"><title>شعار بتّه</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1a1a1a;color:#aaa;font:13px sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}.row{display:flex;gap:20px;align-items:flex-end}img{border-radius:22%}</style></head>
<body>
<!-- شعار اللعبة والتطبيق: 5 أوراق مفرودة (خال من كل نوع + الجوكر الكبير)، وتحتها «بتّه» بخط Cairo، على خلفية كروم بدون شفافية. يحفظ logo.png (1024) -->
<div class="row" id="row"></div>
<div id="info">…</div>
<script>
const O = '#111';
const SUIT = {
  H: ['#d11f1f', '<path d="M0,1.02 L-0.8,0.08 C-1.06,-0.2 -1.03,-0.64 -0.76,-0.87 C-0.48,-1.08 -0.12,-0.99 0,-0.64 C0.12,-0.99 0.48,-1.08 0.76,-0.87 C1.03,-0.64 1.06,-0.2 0.8,0.08 Z"/>'],
  C: ['#111', '<circle cx="0" cy="-0.52" r="0.47"/><circle cx="-0.53" cy="0.12" r="0.47"/><circle cx="0.53" cy="0.12" r="0.47"/><circle cx="0" cy="0.06" r="0.24"/><path d="M-0.08,0.2 C-0.11,0.6 -0.22,0.86 -0.42,1.02 L0.42,1.02 C0.22,0.86 0.11,0.6 0.08,0.2Z"/>'],
  D: ['#d11f1f', '<path d="M0,-1.08 L0.86,0 L0,1.08 L-0.86,0Z"/>'],
  S: ['#111', '<path d="M0,-1 C0.35,-0.6 1,-0.25 1,0.25 C1,0.62 0.62,0.78 0.3,0.62 C0.2,0.58 0.1,0.5 0.06,0.42 C0.1,0.7 0.2,0.88 0.38,1 L-0.38,1 C-0.2,0.88 -0.1,0.7 -0.06,0.42 C-0.1,0.5 -0.2,0.58 -0.3,0.62 C-0.62,0.78 -1,0.62 -1,0.25 C-1,-0.25 -0.35,-0.6 0,-1Z"/>'],
};
const pip = (s, x, y, sc) => `<g transform="translate(${x},${y}) scale(${sc})" fill="${SUIT[s][0]}">${SUIT[s][1]}</g>`;
// المروحة تدور حول نقطة المسكة تحت (PIV)
const PIV = [512, 640], CW = 236, CH = 350, CX = PIV[0] - CW / 2, CY = PIV[1] - 30 - CH;
const card = (s, rot) => `<g transform="rotate(${rot} ${PIV[0]} ${PIV[1]})">
  <rect x="${CX}" y="${CY}" width="${CW}" height="${CH}" rx="24" fill="#fff" stroke="${O}" stroke-width="7"/>
  <text x="${CX + 38}" y="${CY + 64}" font-size="60" font-weight="bold" font-family="'Times New Roman',Times,serif" fill="${SUIT[s][0]}" text-anchor="middle">A</text>
  ${pip(s, CX + 38, CY + 106, 19)}
  ${pip(s, PIV[0], CY + 190, 54)}
</g>`;
// ورقة الجوكر الكبير المعتمدة (صورة) بنفس مقاس وزاوية الأوراق
const jokerCard = (rot, href) => {
  const sc = CW / 400, big = [...'JOKER'].map((ch, i) => `<text x="${CX + 30}" y="${CY + 54 + i * 44}" font-size="44" font-weight="900" font-family="Arial Black, Arial, sans-serif" fill="${i % 2 ? '#cc202c' : '#128c48'}" text-anchor="middle">${ch}</text>`).join('');
  return `<g transform="rotate(${rot} ${PIV[0]} ${PIV[1]})">
  <clipPath id="jc"><rect x="${CX}" y="${CY}" width="${CW}" height="${CH}" rx="24"/></clipPath>
  <rect x="${CX}" y="${CY}" width="${CW}" height="${CH}" rx="24" fill="#fff"/>
  <image href="${href}" x="${CX}" y="${CY}" width="${CW}" height="${CH}" preserveAspectRatio="none" clip-path="url(#jc)"/>
  <rect x="${CX + 4}" y="${CY + 6}" width="${30 * sc + 14}" height="${200 * sc + 6}" fill="#fff"/>
  <rect x="${CX + CW - 30 * sc - 18}" y="${CY + CH - 200 * sc - 12}" width="${30 * sc + 14}" height="${200 * sc + 6}" fill="#fff"/>
  ${big}
  <rect x="${CX}" y="${CY}" width="${CW}" height="${CH}" rx="24" fill="none" stroke="${O}" stroke-width="7"/>
</g>`; };

// الأنميشن (3.2 ثانية): الأوراق تنزل كومة، تنفتح مروحة والجوكر آخرها، لمعة على الجوكر، و«بتّه» تطلع تحتها
async function animate(jokerHref, frozen) {
  await document.fonts.load('700 150px "El Messiri"', 'بتّه'); await document.fonts.ready;
  document.body.style.cssText = 'margin:0;height:100vh;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden';
  document.getElementById('info').remove();
  const row = document.getElementById('row');
  row.style.cssText = 'display:block';
  row.innerHTML = svg(jokerHref).replace('width="1024" height="1024"', 'style="display:block;width:min(92vw,92vh);height:min(92vw,92vh)"');
  const root = row.querySelector('svg'), fan = root.querySelector('g[filter]');
  const cards = [...fan.children], rots = [-36, -18, 0, 18, 36];
  const ns = 'http://www.w3.org/2000/svg', el = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  // اللمعة على الجوكر (داخل نفس قصّة الورقة)
  root.querySelector('defs').insertAdjacentHTML('beforeend', '<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>');
  const shine = el('rect', { y: CY - 80, width: 110, height: CH + 160, fill: 'url(#shine)', 'clip-path': 'url(#jc)' });
  cards[4].appendChild(shine);
  const word = el('text', { x: 512, y: 845, 'text-anchor': 'middle', direction: 'rtl', fill: '#1d1f22', 'font-size': 240, 'font-weight': 700, 'font-family': 'El Messiri', style: 'filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))' });
  word.textContent = 'بتّه';
  root.appendChild(word);

  const clamp = (x) => Math.min(1, Math.max(0, x)), span = (t, a, b) => clamp((t - a) / (b - a));
  const out = (p) => 1 - (1 - p) ** 3, back = (p) => { const c = 1.9; return 1 + (c + 1) * (p - 1) ** 3 + c * (p - 1) ** 2; };
  const draw = (t) => {
    const drop = out(span(t, 0.1, 0.5));
    fan.style.opacity = span(t, 0.1, 0.3);
    fan.setAttribute('transform', `translate(512,${440 - 90 * (1 - drop)}) scale(${1.1 * (1.35 - 0.35 * drop)}) translate(-512,-560)`);
    cards.forEach((c, i) => {
      const p = back(span(t, 0.55 + i * 0.09, 1.05 + i * 0.09));
      c.setAttribute('transform', `rotate(${rots[i] * p} ${PIV[0]} ${PIV[1]})`);
    });
    shine.setAttribute('x', CX - 130 + (CW + 260) * span(t, 1.65, 2.2));
    const w = back(span(t, 1.35, 1.85));
    word.style.opacity = span(t, 1.35, 1.6);
    word.setAttribute('transform', `translate(512,760) scale(${0.7 + 0.3 * w}) translate(-512,-760) translate(0,${40 * (1 - w)})`);
  };
  if (frozen !== null) { draw(+frozen); document.title = 'frame ' + frozen; return; }
  // الصوت (make-logo-sound.js) يبدأ بعد أول ضغطة: المتصفح يمنعه قبلها
  const sound = new Audio('logo_intro.wav');
  const hint = document.createElement('div');
  hint.textContent = 'اضغط لتشغيل الصوت';
  hint.style.cssText = 'position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#fff;font:700 18px "El Messiri",sans-serif;pointer-events:none';
  document.body.appendChild(hint);
  let start = performance.now(), unlocked = false;
  const restart = (now) => { start = now; if (unlocked) { sound.currentTime = 0; sound.play(); } };
  addEventListener('click', () => { unlocked = true; hint.remove(); restart(performance.now()); });
  (function tick(now) { const t = (now - start) / 1000; if (t > 5) restart(now); draw(t > 5 ? 0 : t); requestAnimationFrame(tick); })(start);
}

function svg(jokerHref, bg = true, px = 1024) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="chr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f3f5"/><stop offset=".18" stop-color="#c9ccd1"/><stop offset=".5" stop-color="#8e939a"/><stop offset=".52" stop-color="#7b8087"/><stop offset=".8" stop-color="#a9adb3"/><stop offset="1" stop-color="#d9dbdf"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="skin" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#f0c39d"/><stop offset=".6" stop-color="#e2ab83"/><stop offset="1" stop-color="#c48861"/></radialGradient>
    <linearGradient id="fing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efc29c"/><stop offset=".55" stop-color="#e2ab83"/><stop offset="1" stop-color="#c98e66"/></linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79f78"/><stop offset=".45" stop-color="#efc29c"/><stop offset="1" stop-color="#cf946c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  ${bg ? '<rect width="1024" height="1024" fill="url(#chr)"/><rect x="80" y="14" width="864" height="10" rx="5" fill="url(#gl)"/>' : ''}
  <g filter="url(#sh)" transform="translate(512,440) scale(1.1) translate(-512,-560)">
    ${card('H', -36)}${card('C', -18)}${card('D', 0)}${card('S', 18)}${jokerCard(36, jokerHref)}
  </g>
  </svg>`;
}

(async () => {
  // صورة الجوكر الكبير كـ data URL عشان تنرسم داخل الـ SVG
  const q0 = new URLSearchParams(location.search), SIZE = +(q0.get('size') || 1024);
  const jb = await (await fetch(q0.get('joker') || 'joker_big.png')).blob();
  const jokerHref = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(jb); });
  // ?layers: كل ورقة من المروحة صورة لحالها لأنميشن فتح اللعبة -> intro_H.png ... intro_J.png
  if (q0.has('layers')) {
    const parts = [['H', card('H', 0)], ['C', card('C', 0)], ['D', card('D', 0)], ['S', card('S', 0)], ['J', jokerCard(0, jokerHref)]];
    for (const [id, inner] of parts) {
      const m = 6, w = (CW + m * 2) * 2, h = (CH + m * 2) * 2;
      const src = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${CX - m} ${CY - m} ${CW + m * 2} ${CH + m * 2}">${inner}</svg>`;
      const img = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' })); });
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      await fetch(`/save?name=intro_${id}.png`, { method: 'POST', body: await new Promise((r) => cv.toBlob(r, 'image/png')) });
    }
    document.title = 'exported layers';
    return;
  }
  // ?anim: معاينة أنميشن الشعار (t=1.2 يوقف عند ثانية معيّنة). ضغطة تعيده
  if (q0.has('anim')) return animate(jokerHref, q0.get('t'));
  // ?back: ظهر الورقة بثيم الشعار (نفس الكروم والمروحة و«بتّه» بحد أسود مثل أوراق الشعار) -> back.png
  if (location.search.includes('back')) {
    const q = new URLSearchParams(location.search), W = +(q.get('w') || 400), H = +(q.get('h') || 580), K = W / 400, B = 12 * K, R = 28 * K, S = W / 1024 * 0.94, X = (W - 1024 * S) / 2, Y = (H - 930 * S) / 2 - 28 * S;
    const fan = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(new Blob([svg(jokerHref, false, Math.ceil(1024 * S))], { type: 'image/svg+xml' })); });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const plain = q.has('noframe'); // للطباعة: بدون حد ولا حواف مدوّرة
    const round = () => { g.beginPath(); if (plain) g.rect(0, 0, W, H); else g.roundRect(B / 2, B / 2, W - B, H - B, R); };
    round();
    const chr = g.createLinearGradient(0, 0, 0, H);
    [[0, '#f2f3f5'], [.18, '#c9ccd1'], [.5, '#8e939a'], [.52, '#7b8087'], [.8, '#a9adb3'], [1, '#d9dbdf']].forEach(([o, c]) => chr.addColorStop(o, c));
    g.fillStyle = chr; g.fill();
    g.save(); g.clip();
    g.drawImage(fan, X, Y, 1024 * S, 1024 * S);
    await document.fonts.load('700 150px "El Messiri"', 'بتّه'); await document.fonts.ready;
    g.font = `700 ${240 * S}px "El Messiri"`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.direction = 'rtl';
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 5 * K; g.shadowOffsetY = 2 * K;
    g.fillStyle = '#1d1f22'; g.fillText('بتّه', W / 2, Y + 845 * S);
    g.restore();
    if (!plain) { round(); g.strokeStyle = O; g.lineWidth = B; g.stroke(); }
    const png = await new Promise((r) => cv.toBlob(r, 'image/png'));
    await fetch('/save?name=' + (q.get('out') || 'back.png'), { method: 'POST', body: png });
    document.getElementById('row').innerHTML = `<img src="${URL.createObjectURL(png)}" width="400">`;
    document.title = 'exported back';
    return;
  }
  const blob = new Blob([svg(jokerHref, true, SIZE)], { type: 'image/svg+xml' });
  const img = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(blob); });
  const cv = document.createElement('canvas'); cv.width = SIZE; cv.height = SIZE;
  const g = cv.getContext('2d');
  g.scale(SIZE / 1024, SIZE / 1024);
  g.drawImage(img, 0, 0, 1024, 1024);
  // «بتّه» بخط المسيري (El Messiri) الغامق تحت
  await document.fonts.load('700 150px "El Messiri"', 'بتّه'); await document.fonts.ready;
  g.font = '700 240px "El Messiri"'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.direction = 'rtl';
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 12; g.shadowOffsetY = 6;
  g.fillStyle = '#1d1f22'; g.fillText('بتّه', 512, 845);
  const png = await new Promise((r) => cv.toBlob(r, 'image/png'));
  await fetch('/save?name=' + (q0.get('out') || 'logo.png'), { method: 'POST', body: png });
  document.title = 'exported logo';
  const url = URL.createObjectURL(png);
  document.getElementById('row').innerHTML = [256, 96, 48].map((s) => `<img src="${url}" width="${s}" height="${s}">`).join('');
  document.getElementById('info').textContent = 'saved logo.png';
})().catch((e) => document.getElementById('info').textContent = 'error ' + e);
</script>
</body>
</html>
