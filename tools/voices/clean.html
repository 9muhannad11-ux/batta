<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>تنظيف أصوات الشخصيات</title>
<style>body{font:14px sans-serif;background:#111;color:#ddd;padding:12px}canvas{background:#000;display:block;margin:6px 0}</style></head>
<body>
<!-- تنظيف تسجيلات الشخصيات: ?f=ملف_خام&out=اسم.wav
     1) فك الصوت (ogg/mp3/m4a) وتحويله لقناة وحدة 44.1kHz
     2) شيل الشوشرة: نقيس طيف الضجة من أهدأ اللحظات، ونخفّض كل تردد قريب منه (spectral gating) بقناع ناعم
     3) فلتر يشيل الطنين الواطي (أقل من 90Hz)
     4) قص السكوت قبل الكلام وبعده، وتلاشي قصير بالأطراف
     5) توحيد العلو: نفس قوة الصوت لكل التسجيلات، بدون ما يتجاوز الحد -->
<div id="info">…</div>
<canvas id="before" width="700" height="80"></canvas>
<canvas id="after" width="700" height="80"></canvas>
<script>
const q = new URLSearchParams(location.search);
const RATE = 44100;

function fft(re, im, inv) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (inv ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k], ai = im[i + k];
        const br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ar + br; im[i + k] = ai + bi; re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
  if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

function denoise(x) {
  const N = 1024, H = 256, bins = N / 2 + 1;
  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
  const pad = new Float32Array(x.length + 2 * N); pad.set(x, N);
  const frames = Math.floor((pad.length - N) / H) + 1;
  const spec = [];
  for (let f = 0; f < frames; f++) {
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < N; i++) re[i] = pad[f * H + i] * win[i];
    fft(re, im, false);
    spec.push({ re, im });
  }
  const mag = spec.map(({ re, im }) => Float64Array.from({ length: bins }, (_, k) => Math.hypot(re[k], im[k])));
  // طيف الضجة: متوسط أهدأ 20% من الفريمات
  const energy = mag.map((m) => m.reduce((a, b) => a + b * b, 0));
  const order = energy.map((e, i) => [e, i]).sort((a, b) => a[0] - b[0]);
  const quiet = order.slice(0, Math.max(3, Math.floor(frames * 0.2))).map((p) => p[1]);
  const nMean = new Float64Array(bins), nStd = new Float64Array(bins);
  for (const f of quiet) for (let k = 0; k < bins; k++) nMean[k] += mag[f][k] / quiet.length;
  for (const f of quiet) for (let k = 0; k < bins; k++) nStd[k] += (mag[f][k] - nMean[k]) ** 2 / quiet.length;
  for (let k = 0; k < bins; k++) nStd[k] = Math.sqrt(nStd[k]);
  // قناع: التردد اللي فوق الضجة بفرق واضح يبقى، والباقي ينخفض
  const mask = mag.map((m) => Float64Array.from(m, (v, k) => {
    const thr = nMean[k] + 1.6 * nStd[k];
    return v <= thr ? 0.03 : Math.min(1, 0.03 + (v - thr) / (thr * 0.8 + 1e-9));
  }));
  // نعومة القناع بالوقت والتردد عشان ما يطلع صوت "معدني"
  const sm = mask.map((row, f) => Float64Array.from(row, (_, k) => {
    let s = 0, c = 0;
    for (let df = -2; df <= 2; df++) for (let dk = -2; dk <= 2; dk++) {
      const ff = f + df, kk = k + dk;
      if (ff >= 0 && ff < frames && kk >= 0 && kk < bins) { s += mask[ff][kk]; c++; }
    }
    return s / c;
  }));
  const out = new Float64Array(pad.length), norm = new Float64Array(pad.length);
  for (let f = 0; f < frames; f++) {
    const { re, im } = spec[f];
    for (let k = 0; k < bins; k++) {
      re[k] *= sm[f][k]; im[k] *= sm[f][k];
      if (k > 0 && k < N / 2) { re[N - k] = re[k]; im[N - k] = -im[k]; }
    }
    fft(re, im, true);
    for (let i = 0; i < N; i++) { out[f * H + i] += re[i] * win[i]; norm[f * H + i] += win[i] * win[i]; }
  }
  return Float32Array.from(x, (_, i) => out[i + N] / (norm[i + N] || 1));
}

function highpass(x, fc) {
  const rc = 1 / (2 * Math.PI * fc), dt = 1 / RATE, a = rc / (rc + dt);
  const y = new Float32Array(x.length);
  for (let i = 1; i < x.length; i++) y[i] = a * (y[i - 1] + x[i] - x[i - 1]);
  return y;
}

// تفخيم: نزّل طبقة الصوت (semis، بالسالب) بدون ما تتغير السرعة:
// نقصّر الصوت بـ WSOLA (قطع متداخلة نختار مكانها عشان تتطابق) بنفس الطبقة،
// وبعدين نبطّئه بإعادة العينات لين يرجع لطوله الأصلي، فتنزل الطبقة
function pitchDown(x, semis) {
  if (!semis) return x;
  const stretch = Math.pow(2, semis / 12); // أقل من 1: الصوت يقصر قبل ما نبطّئه
  const N = Math.round(RATE * 0.03), Hs = Math.round(N / 2), Ha = Math.round(Hs / stretch), tol = Math.round(RATE * 0.008);
  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
  const outLen = Math.ceil(x.length * stretch) + N;
  const y = new Float32Array(outLen), w = new Float32Array(outLen);
  let prev = 0;
  for (let k = 0; k * Hs + N < outLen; k++) {
    const nominal = k * Ha;
    if (nominal + N + tol >= x.length) break;
    let best = nominal, bestC = -Infinity;
    if (k > 0) {
      // نختار مكان القطعة اللي يشبه استمرار القطعة اللي قبلها
      for (let d = -tol; d <= tol; d += 2) {
        const p = nominal + d;
        if (p < 0) continue;
        let c = 0;
        for (let i = 0; i < N; i += 4) c += x[p + i] * x[prev + Hs + i];
        if (c > bestC) { bestC = c; best = p; }
      }
    }
    for (let i = 0; i < N; i++) { y[k * Hs + i] += x[best + i] * win[i]; w[k * Hs + i] += win[i]; }
    prev = best;
  }
  for (let i = 0; i < outLen; i++) if (w[i] > 1e-3) y[i] /= w[i];
  // إعادة العينات: نقرى الصوت المقصّر أبطأ لين يرجع الطول الأصلي، فتنزل الطبقة
  const out = new Float32Array(x.length);
  for (let i = 0; i < out.length; i++) {
    const p = i * stretch, j = Math.floor(p), f = p - j;
    out[i] = (y[j] || 0) * (1 - f) + (y[j + 1] || 0) * f;
  }
  return out;
}

// باس أكثر: low-shelf تحت 220Hz، وتنعيم بسيط للحدة فوق 7kHz
async function warm(x, bassDb) {
  if (!bassDb) return x;
  const ctx = new OfflineAudioContext(1, x.length, RATE);
  const b = ctx.createBuffer(1, x.length, RATE); b.copyToChannel(x, 0);
  const src = ctx.createBufferSource(); src.buffer = b;
  const shelf = ctx.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 220; shelf.gain.value = bassDb;
  const hi = ctx.createBiquadFilter(); hi.type = 'highshelf'; hi.frequency.value = 7000; hi.gain.value = -3;
  src.connect(shelf).connect(hi).connect(ctx.destination); src.start();
  return (await ctx.startRendering()).getChannelData(0);
}

function trimAndLevel(x) {
  const win = Math.round(RATE * 0.01);
  const env = [];
  for (let i = 0; i < x.length; i += win) { let m = 0; for (let j = i; j < Math.min(x.length, i + win); j++) m = Math.max(m, Math.abs(x[j])); env.push(m); }
  const peak = Math.max(...env), thr = peak * 0.1;
  // بداية الكلام: أول مكان يبقى فيه الصوت فوق العتبة 6 نوافذ (60ms) ورا بعض،
  // عشان طقة زر التسجيل أو نفس قصير ما ينحسب بداية
  const loud = (i) => [0, 1, 2, 3, 4, 5].every((k) => env[i + k] > thr);
  let a = 0;
  while (a < env.length - 6 && !loud(a)) a++;
  let b = env.length - 1;
  while (b > a && !(env[b] > thr && env[b - 1] > thr)) b--;
  a = Math.max(0, a * win - Math.round(RATE * 0.05)); b = Math.min(x.length, (b + 1) * win + Math.round(RATE * 0.12));
  const y = x.slice(a, b);
  const fade = Math.round(RATE * 0.015);
  for (let i = 0; i < fade && i < y.length; i++) { y[i] *= i / fade; y[y.length - 1 - i] *= i / fade; }
  // نفس قوة الصوت: RMS للكلام (فوق العتبة) على -16 dBFS، والقمة ما تتجاوز 0.95
  let sum = 0, n = 0;
  for (const v of y) if (Math.abs(v) > thr) { sum += v * v; n++; }
  const rms = Math.sqrt(sum / Math.max(1, n));
  let g = 0.158 / (rms || 1);
  const pk = y.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
  g = Math.min(g, 0.95 / (pk || 1));
  return y.map((v) => v * g);
}

function wav(y) {
  const out = new DataView(new ArrayBuffer(44 + y.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + y.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true); out.setUint32(24, RATE, true);
  out.setUint32(28, RATE * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, y.length * 2, true);
  y.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
  return out.buffer;
}

function draw(id, y) {
  const c = document.getElementById(id), g = c.getContext('2d'), step = Math.max(1, Math.floor(y.length / c.width));
  g.fillStyle = id === 'after' ? '#6c6' : '#c66';
  for (let x = 0; x < c.width; x++) { let m = 0; for (let j = x * step; j < (x + 1) * step && j < y.length; j++) m = Math.max(m, Math.abs(y[j])); g.fillRect(x, 40 - m * 40, 1, m * 80); }
}

(async () => {
  const data = await (await fetch(q.get('f'))).arrayBuffer();
  const dec = await new AudioContext().decodeAudioData(data);
  const off = new OfflineAudioContext(1, Math.ceil(dec.duration * RATE), RATE);
  const src = off.createBufferSource(); src.buffer = dec; src.connect(off.destination); src.start();
  const raw = (await off.startRendering()).getChannelData(0);
  draw('before', raw);
  // &pitch=-1.5 (نصف درجات) و &bass=5 (dB) للتفخيم
  const pitch = Number(q.get('pitch') || 0), bass = Number(q.get('bass') || 0);
  const clean = trimAndLevel(await warm(pitchDown(highpass(denoise(raw), 90), pitch), bass));
  draw('after', clean);
  await fetch('/save?name=' + q.get('out'), { method: 'POST', body: wav(clean) });
  document.title = 'done';
  document.getElementById('info').textContent = `${q.get('f')}: ${dec.duration.toFixed(2)}s → ${(clean.length / RATE).toFixed(2)}s  saved ${q.get('out')}`;
})().catch((e) => { document.title = 'error'; document.getElementById('info').textContent = 'error ' + e; });
</script>
</body>
</html>
